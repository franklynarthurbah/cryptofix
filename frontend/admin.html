<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CryptoVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00ff88;
            --secondary: #0099ff;
            --dark: #0a0e1a;
            --darker: #050810;
            --accent: #ff006e;
            --text: #e0e6ed;
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--darker);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(125deg, #050810 0%, #0a0e1a 50%, #0d1520 100%);
        }
        .grid-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 110, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 110, 0.05) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1; opacity: 0.3;
        }
        .login-container {
            background: rgba(10, 14, 26, 0.9);
            border: 2px solid rgba(255, 0, 110, 0.5);
            border-radius: 12px;
            padding: 50px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 60px rgba(255, 0, 110, 0.3);
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
        }
        .subtitle {
            text-align: center;
            margin-bottom: 40px;
            color: var(--accent);
            font-size: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 0, 110, 0.05);
            border: 1px solid rgba(255, 0, 110, 0.3);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 0, 110, 0.1);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.2);
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent), #ff4500);
            color: white;
            border: none;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 0, 110, 0.5);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideIn 0.3s;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .alert.success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid var(--primary);
            color: var(--primary);
        }
        .alert.error {
            background: rgba(255, 0, 110, 0.2);
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        .alert.show { display: block; }
        .footer-link {
            text-align: center;
            margin-top: 30px;
            color: rgba(224, 230, 237, 0.6);
            font-size: 14px;
        }
        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
        .warning {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid rgba(255, 165, 0, 0.3);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #ffa500;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="grid-overlay"></div>

    <div class="login-container">
        <div class="logo">ADMIN PANEL</div>
        <div class="subtitle">🔐 Authorized Access Only</div>

        <div class="warning">
            ⚠️ Unauthorized access is monitored and logged
        </div>

        <div class="alert" id="alert"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Admin username" autocomplete="username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Admin password" autocomplete="current-password">
            </div>

            <div class="form-group">
                <label>Access Code</label>
                <input type="password" id="code" required placeholder="Re-enter access code" value="?X!Z*" readonly style="opacity: 0.6;">
            </div>

            <button type="submit" class="btn" id="loginBtn">LOGIN TO ADMIN PANEL</button>
        </form>

        <div class="footer-link">
            <a href="login.html">← Back to User Login</a>
        </div>
    </div>

    <script>
        const API_URL = `http://${window.location.hostname}:8001/api`;

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type} show`;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'AUTHENTICATING...';

            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                code: document.getElementById('code').value
            };

            try {
                const response = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('admin_token', result.token);
                    localStorage.setItem('admin', JSON.stringify(result.admin));
                    
                    showAlert('Admin authentication successful!', 'success');
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1000);
                } else {
                    showAlert(result.detail || 'Invalid admin credentials', 'error');
                    btn.disabled = false;
                    btn.textContent = 'LOGIN TO ADMIN PANEL';
                }
            } catch (error) {
                showAlert('Connection error. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'LOGIN TO ADMIN PANEL';
            }
        });
    </script>
</body>
</html>
