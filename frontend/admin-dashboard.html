<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - CryptoVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #00ff88; --secondary: #0099ff; --dark: #0a0e1a; --accent: #ff006e; --text: #e0e6ed; }
        body { font-family: 'Rajdhani', sans-serif; background: #0a0e1a; color: var(--text); }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .header {
            background: linear-gradient(135deg, var(--accent), #ff4500);
            padding: 30px; border-radius: 10px; margin-bottom: 30px;
        }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 36px; text-transform: uppercase; letter-spacing: 3px; }
        .stats-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 0, 110, 0.1); border: 1px solid rgba(255, 0, 110, 0.3);
            padding: 25px; border-radius: 10px; text-align: center;
        }
        .stat-value {
            font-family: 'Orbitron', sans-serif; font-size: 36px; font-weight: 900;
            color: var(--accent); margin: 10px 0;
        }
        .tabs {
            display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .tab {
            padding: 12px 24px; background: rgba(255, 0, 110, 0.2);
            border: 2px solid rgba(255, 0, 110, 0.3); border-radius: 6px;
            cursor: pointer; font-weight: 700; text-transform: uppercase;
            transition: all 0.3s;
        }
        .tab:hover, .tab.active {
            background: rgba(255, 0, 110, 0.3); border-color: var(--accent);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table {
            width: 100%; border-collapse: collapse;
            background: rgba(10, 14, 26, 0.5); border-radius: 8px; overflow: hidden;
        }
        th, td {
            padding: 15px; text-align: left;
            border-bottom: 1px solid rgba(255, 0, 110, 0.2);
        }
        th { background: rgba(255, 0, 110, 0.2); font-weight: 700; text-transform: uppercase; }
        .btn {
            padding: 8px 16px; border: none; border-radius: 4px;
            font-family: 'Rajdhani', sans-serif; font-weight: 700;
            cursor: pointer; transition: all 0.3s; margin-right: 5px;
        }
        .btn-success { background: var(--primary); color: var(--dark); }
        .btn-danger { background: var(--accent); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 ADMIN DASHBOARD</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div>Total Users</div>
                <div class="stat-value" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <div>Pending KYC</div>
                <div class="stat-value" id="pendingKYC">0</div>
            </div>
            <div class="stat-card">
                <div>Pending Payments</div>
                <div class="stat-value" id="pendingPayments">0</div>
            </div>
            <div class="stat-card">
                <div>Unread Chats</div>
                <div class="stat-value" id="unreadChats">0</div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="showTab('users')">👥 USERS</div>
            <div class="tab" onclick="showTab('payments')">💳 PAYMENTS</div>
            <div class="tab" onclick="showTab('kyc')">🆔 KYC</div>
            <div class="tab" onclick="showTab('chats')">💬 CHATS</div>
        </div>

        <div id="users-tab" class="tab-content active">
            <table id="usersTable">
                <thead><tr><th>Email</th><th>Name</th><th>KYC</th><th>Balance</th><th>Actions</th></tr></thead>
                <tbody id="usersBody"><tr><td colspan="5">Loading...</td></tr></tbody>
            </table>
        </div>

        <div id="payments-tab" class="tab-content">
            <table>
                <thead><tr><th>User</th><th>Method</th><th>Amount</th><th>Crypto</th><th>Actions</th></tr></thead>
                <tbody id="paymentsBody"><tr><td colspan="5">Loading...</td></tr></tbody>
            </table>
        </div>

        <div id="kyc-tab" class="tab-content">
            <table>
                <thead><tr><th>User</th><th>Name</th><th>Country</th><th>ID Type</th><th>Actions</th></tr></thead>
                <tbody id="kycBody"><tr><td colspan="5">Loading...</td></tr></tbody>
            </table>
        </div>

        <div id="chats-tab" class="tab-content">
            <div id="chatsList">Loading chats...</div>
        </div>
    </div>

    <script>
        const API_URL = `http://${window.location.hostname}:8001/api`;
        const token = localStorage.getItem('admin_token');

        if (!token) window.location.href = 'admin.html';

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
            if (tabName === 'users') loadUsers();
            else if (tabName === 'payments') loadPayments();
            else if (tabName === 'kyc') loadKYC();
            else if (tabName === 'chats') loadChats();
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/admin/stats`, {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                const data = await response.json();
                document.getElementById('totalUsers').textContent = data.total_users;
                document.getElementById('pendingKYC').textContent = data.kyc_pending;
                document.getElementById('pendingPayments').textContent = data.pending_payments;
                document.getElementById('unreadChats').textContent = data.unread_chats;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/admin/users`, {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                const data = await response.json();
                const tbody = document.getElementById('usersBody');
                tbody.innerHTML = data.users.map(user => `
                    <tr>
                        <td>${user.email}</td>
                        <td>${user.full_name}</td>
                        <td>${user.kyc_verified ? '✅' : '❌'}</td>
                        <td>${(user.balances?.USDT || 0).toFixed(2)}</td>
                        <td><button class="btn btn-success" onclick="alert('View user details')">View</button></td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        async function loadPayments() {
            try {
                const response = await fetch(`${API_URL}/admin/payments/pending`, {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                const data = await response.json();
                const tbody = document.getElementById('paymentsBody');
                tbody.innerHTML = data.payments.length === 0 ? 
                    '<tr><td colspan="5">No pending payments</td></tr>' :
                    data.payments.map(p => `
                        <tr>
                            <td>${p.user_email}</td>
                            <td>${p.payment_method}</td>
                            <td>$${p.amount}</td>
                            <td>${p.crypto}</td>
                            <td>
                                <button class="btn btn-success" onclick="verifyPayment('${p.id}', 'approved')">Approve</button>
                                <button class="btn btn-danger" onclick="verifyPayment('${p.id}', 'rejected')">Reject</button>
                            </td>
                        </tr>
                    `).join('');
            } catch (error) {
                console.error('Error loading payments:', error);
            }
        }

        async function loadKYC() {
            try {
                const response = await fetch(`${API_URL}/admin/kyc-pending`, {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                const data = await response.json();
                const tbody = document.getElementById('kycBody');
                tbody.innerHTML = data.submissions.length === 0 ?
                    '<tr><td colspan="5">No pending KYC submissions</td></tr>' :
                    data.submissions.map(kyc => `
                        <tr>
                            <td>${kyc.user?.email || 'N/A'}</td>
                            <td>${kyc.full_name}</td>
                            <td>${kyc.country}</td>
                            <td>${kyc.id_type}</td>
                            <td>
                                <button class="btn btn-success" onclick="approveKYC('${kyc.user_id}')">Approve</button>
                                <button class="btn btn-danger" onclick="rejectKYC('${kyc.user_id}')">Reject</button>
                            </td>
                        </tr>
                    `).join('');
            } catch (error) {
                console.error('Error loading KYC:', error);
            }
        }

        async function loadChats() {
            document.getElementById('chatsList').innerHTML = 'Chat management coming soon...';
        }

        async function verifyPayment(paymentId, status) {
            const notes = status === 'rejected' ? prompt('Rejection reason:') : 'Approved';
            if (status === 'rejected' && !notes) return;
            
            try {
                const response = await fetch(`${API_URL}/admin/payments/verify`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({payment_id: paymentId, status, notes})
                });
                
                if (response.ok) {
                    alert(`Payment ${status}!`);
                    loadPayments();
                    loadStats();
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function approveKYC(userId) {
            if (!confirm('Approve this KYC?')) return;
            try {
                const response = await fetch(`${API_URL}/admin/kyc-approve/${userId}`, {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${token}`}
                });
                if (response.ok) {
                    alert('KYC approved!');
                    loadKYC();
                    loadStats();
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function rejectKYC(userId) {
            const reason = prompt('Rejection reason:');
            if (!reason) return;
            try {
                const response = await fetch(`${API_URL}/admin/kyc-reject/${userId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({reason})
                });
                if (response.ok) {
                    alert('KYC rejected');
                    loadKYC();
                    loadStats();
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        loadStats();
        loadUsers();
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
