<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Support Chat - CryptoVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #00ff88; --secondary: #0099ff; --dark: #0a0e1a; --darker: #050810; --text: #e0e6ed; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--darker); color: var(--text); }
        .chat-container {
            max-width: 900px; margin: 20px auto; background: rgba(10, 14, 26, 0.9);
            border: 2px solid rgba(0, 255, 136, 0.3); border-radius: 12px; height: 90vh;
            display: flex; flex-direction: column;
        }
        .chat-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark); padding: 20px; font-family: 'Orbitron', sans-serif;
            font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
        }
        .messages { flex: 1; padding: 20px; overflow-y: auto; }
        .message {
            margin-bottom: 15px; padding: 12px; border-radius: 8px;
            background: rgba(0, 255, 136, 0.1); border: 1px solid rgba(0, 255, 136, 0.2);
        }
        .input-area {
            padding: 20px; border-top: 1px solid rgba(0, 255, 136, 0.2);
            display: flex; gap: 10px;
        }
        .input-area textarea {
            flex: 1; padding: 12px; background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 6px;
            color: var(--text); font-family: 'Rajdhani', sans-serif; resize: none;
        }
        .btn {
            padding: 12px 24px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark); border: none; border-radius: 6px;
            font-family: 'Rajdhani', sans-serif; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">💬 SUPPORT CHAT</div>
        <div class="messages" id="messages">
            <div class="message">Welcome to CryptoVault support! How can we help you today?</div>
        </div>
        <div class="input-area">
            <textarea id="messageInput" rows="2" placeholder="Type your message..."></textarea>
            <button class="btn" onclick="sendMessage()">SEND</button>
        </div>
    </div>
    <script>
        const API_URL = `http://${window.location.hostname}:8001/api`;
        const WS_URL = `ws://${window.location.hostname}:8001`;
        const token = localStorage.getItem('token');
        let ws = null;

        if (!token) window.location.href = 'login.html';

        function connectWebSocket() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!user.id) return;
            ws = new WebSocket(`${WS_URL}/ws/${user.id}`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'admin_chat_reply') {
                    addMessage(data.message.message, 'admin');
                }
            };
        }

        function addMessage(text, sender) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            div.textContent = `${sender === 'admin' ? 'Support' : 'You'}: ${text}`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            try {
                const formData = new FormData();
                formData.append('message', message);
                
                const response = await fetch(`${API_URL}/chat/send`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (response.ok) {
                    addMessage(message, 'user');
                    input.value = '';
                }
            } catch (error) {
                alert('Error sending message: ' + error.message);
            }
        }

        connectWebSocket();
    </script>
</body>
</html>
