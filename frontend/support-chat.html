<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Chat - CryptoVault</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .back-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message.admin .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 60%;
        }

        .message.admin .message-bubble {
            background: white;
            border: 2px solid #e5e7eb;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 5px;
        }

        .message-file {
            margin-top: 8px;
        }

        .message-file img {
            max-width: 200px;
            border-radius: 8px;
        }

        .message-file a {
            color: inherit;
            text-decoration: underline;
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 2px solid #e5e7eb;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .file-input-label {
            padding: 12px;
            background: #f3f4f6;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #e5e7eb;
        }

        #file-input {
            display: none;
        }

        #message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            font-family: inherit;
            max-height: 100px;
        }

        #message-input:focus {
            outline: none;
            border-color: #667eea;
        }

        #send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        #send-btn:hover {
            transform: scale(1.05);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .selected-file {
            padding: 8px 12px;
            background: #e0e7ff;
            border-radius: 8px;
            font-size: 12px;
            color: #4338ca;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .selected-file button {
            background: none;
            border: none;
            color: #dc2626;
            cursor: pointer;
            font-weight: bold;
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            font-size: 12px;
            color: #6b7280;
            font-style: italic;
        }

        .typing-indicator.active {
            display: block;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        .notification.show {
            display: block;
        }

        .connection-status {
            font-size: 12px;
            opacity: 0.8;
        }

        .connection-status.connected {
            color: #4ade80;
        }

        .connection-status.disconnected {
            color: #f87171;
        }

        @media (max-width: 768px) {
            .message-content {
                max-width: 80%;
            }

            .chat-container {
                height: 95vh;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>
                <span class="status-indicator" id="status-indicator"></span>
                Support Chat
            </h1>
            <div>
                <span class="connection-status" id="connection-status">●</span>
                <button class="back-btn" onclick="goBack()">← Back</button>
            </div>
        </div>

        <div class="messages-container" id="messages">
            <!-- Messages will be dynamically added here -->
        </div>

        <div class="typing-indicator" id="typing-indicator">
            Admin is typing...
        </div>

        <div class="input-container">
            <label for="file-input" class="file-input-label" title="Attach file">
                📎
            </label>
            <input type="file" id="file-input" accept="image/*,.pdf,.doc,.docx">
            
            <div style="flex: 1;">
                <div id="selected-file-display"></div>
                <textarea 
                    id="message-input" 
                    placeholder="Type your message..."
                    rows="1"
                ></textarea>
            </div>
            
            <button id="send-btn">Send</button>
        </div>
    </div>

    <div class="notification" id="notification">
        <div id="notification-text"></div>
    </div>

    <script>
        const API_URL = 'http://164.92.138.206:8001/api';
        const WS_URL = 'ws://164.92.138.206:8001';
        let ws = null;
        let token = localStorage.getItem('token');
        let userId = null;
        let selectedFile = null;

        // Auto-resize textarea
        const messageInput = document.getElementById('message-input');
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        // File selection
        document.getElementById('file-input').addEventListener('change', function(e) {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                document.getElementById('selected-file-display').innerHTML = `
                    <div class="selected-file">
                        📄 ${selectedFile.name}
                        <button onclick="clearFile()">✕</button>
                    </div>
                `;
            }
        });

        function clearFile() {
            selectedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('selected-file-display').innerHTML = '';
        }

        function goBack() {
            window.location.href = '/dashboard.html';
        }

        function showNotification(text) {
            const notification = document.getElementById('notification');
            document.getElementById('notification-text').textContent = text;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        function getUserInfo() {
            const payload = JSON.parse(atob(token.split('.')[1]));
            userId = payload.user_id;
        }

        function connectWebSocket() {
            if (!userId) return;

            const statusIndicator = document.getElementById('status-indicator');
            const connectionStatus = document.getElementById('connection-status');
            
            ws = new WebSocket(`${WS_URL}/ws/${userId}`);

            ws.onopen = () => {
                console.log('WebSocket connected');
                statusIndicator.style.background = '#4ade80';
                connectionStatus.textContent = '● Online';
                connectionStatus.className = 'connection-status connected';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);

                if (data.type === 'admin_chat_reply') {
                    addMessage(data.message, 'admin');
                    playNotificationSound();
                    showNotification('New message from support');
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                statusIndicator.style.background = '#f87171';
                connectionStatus.textContent = '● Offline';
                connectionStatus.className = 'connection-status disconnected';
                
                // Reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function addMessage(message, sender) {
            const messagesContainer = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const time = new Date(message.created_at).toLocaleTimeString();
            const senderName = sender === 'admin' ? 'Support' : 'You';
            const avatarLetter = senderName[0];

            let fileHtml = '';
            if (message.file_url) {
                const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(message.file_url);
                if (isImage) {
                    fileHtml = `<div class="message-file"><img src="${message.file_url}" alt="Attachment"></div>`;
                } else {
                    fileHtml = `<div class="message-file"><a href="${message.file_url}" target="_blank">📄 View Attachment</a></div>`;
                }
            }

            messageDiv.innerHTML = `
                <div class="avatar">${avatarLetter}</div>
                <div class="message-content">
                    <div class="message-bubble">
                        ${message.message}
                        ${fileHtml}
                    </div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function loadMessages() {
            try {
                const response = await fetch(`${API_URL}/chat/messages`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    data.messages.forEach(message => {
                        addMessage(message, message.sender);
                    });
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();

            if (!message && !selectedFile) return;

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('message', message || 'Sent an attachment');
                if (selectedFile) {
                    formData.append('file', selectedFile);
                }

                const response = await fetch(`${API_URL}/chat/send`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    addMessage(data.message, 'user');
                    messageInput.value = '';
                    messageInput.style.height = 'auto';
                    clearFile();
                } else {
                    showNotification('Failed to send message');
                }
            } catch (error) {
                console.error('Error sending message:', error);
                showNotification('Error sending message');
            } finally {
                sendBtn.disabled = false;
            }
        }

        function playNotificationSound() {
            // Simple notification sound
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // Event listeners
        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initialize
        if (!token) {
            window.location.href = '/login.html';
        } else {
            getUserInfo();
            loadMessages();
            connectWebSocket();
        }

        // Check for unread messages periodically
        setInterval(async () => {
            try {
                const response = await fetch(`${API_URL}/chat/unread-count`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.unread_count > 0) {
                        document.title = `(${data.unread_count}) Support Chat - CryptoVault`;
                    } else {
                        document.title = 'Support Chat - CryptoVault';
                    }
                }
            } catch (error) {
                console.error('Error checking unread:', error);
            }
        }, 5000);
    </script>
</body>
</html>
