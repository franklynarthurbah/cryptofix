<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CryptoVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00ff88;
            --secondary: #0099ff;
            --dark: #0a0e1a;
            --darker: #050810;
            --accent: #ff006e;
            --text: #e0e6ed;
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--darker);
            color: var(--text);
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 260px;
            background: rgba(10, 14, 26, 0.95);
            border-right: 1px solid rgba(0, 255, 136, 0.2);
            padding: 20px;
            z-index: 100;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 40px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }
        .menu {
            list-style: none;
        }
        .menu-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .menu-item:hover, .menu-item.active {
            background: rgba(0, 255, 136, 0.15);
            color: var(--primary);
        }
        .main-content {
            margin-left: 260px;
            padding: 30px;
            min-height: 100vh;
        }
        .header {
            background: rgba(10, 14, 26, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 25px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(10, 14, 26, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 25px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }
        .stat-card h3 {
            font-size: 14px;
            color: rgba(224, 230, 237, 0.7);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .balances-section {
            background: rgba(10, 14, 26, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .balances-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .balance-card {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s;
        }
        .balance-card:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }
        .balance-crypto {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .balance-symbol {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .balance-amount {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .action-btn {
            padding: 15px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
        }
        .logout-btn {
            margin-top: auto;
            padding: 12px 15px;
            background: rgba(255, 0, 110, 0.2);
            border: 1px solid rgba(255, 0, 110, 0.3);
            border-radius: 6px;
            color: var(--accent);
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            width: 100%;
        }
        .logout-btn:hover {
            background: rgba(255, 0, 110, 0.3);
        }
        .sidebar-bottom {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">CRYPTOVAULT</div>
        <ul class="menu">
            <a href="dashboard.html" class="menu-item active">
                <span>📊</span> Dashboard
            </a>
            <a href="wallet.html" class="menu-item">
                <span>💰</span> Wallet
            </a>
            <a href="trade.html" class="menu-item">
                <span>📈</span> Trade
            </a>
            <a href="mining.html" class="menu-item">
                <span>⛏️</span> Mining
            </a>
            <a href="deposit.html" class="menu-item">
                <span>💳</span> Deposit
            </a>
            <a href="withdraw.html" class="menu-item">
                <span>💸</span> Withdraw
            </a>
            <a href="kyc.html" class="menu-item">
                <span>🆔</span> KYC
            </a>
            <a href="support-chat.html" class="menu-item">
                <span>💬</span> Support
            </a>
        </ul>
        <div class="sidebar-bottom">
            <button class="logout-btn" onclick="logout()">🚪 LOGOUT</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>DASHBOARD</h1>
            <div id="userName">Loading...</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>💰 Total Balance</h3>
                <div class="stat-value" id="totalBalance">$0.00</div>
            </div>
            <div class="stat-card">
                <h3>📈 Total Earnings</h3>
                <div class="stat-value" id="totalEarnings">$0.00</div>
            </div>
            <div class="stat-card">
                <h3>⛏️ Mining Status</h3>
                <div class="stat-value" id="miningStatus">-</div>
            </div>
            <div class="stat-card">
                <h3>✅ KYC Status</h3>
                <div class="stat-value" id="kycStatus">-</div>
            </div>
        </div>

        <div class="quick-actions">
            <a href="trade.html" class="action-btn">📈 TRADE NOW</a>
            <a href="deposit.html" class="action-btn">💳 DEPOSIT</a>
            <a href="mining.html" class="action-btn">⛏️ START MINING</a>
            <a href="withdraw.html" class="action-btn">💸 WITHDRAW</a>
        </div>

        <div class="balances-section">
            <h2 style="font-family: 'Orbitron', sans-serif; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px;">Your Crypto Balances</h2>
            <div class="balances-grid" id="balancesGrid">
                <div style="text-align: center; padding: 40px; color: rgba(224, 230, 237, 0.5);">Loading balances...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = `http://${window.location.hostname}:8001/api`;
        const WS_URL = `ws://${window.location.hostname}:8001`;
        let ws = null;
        let token = localStorage.getItem('token');
        let user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            window.location.href = 'login.html';
        }

        const cryptoIcons = {
            'BTC': '₿', 'ETH': 'Ξ', 'USDT': '₮', 'BNB': '🔸',
            'SOL': '◎', 'XRP': '✕', 'ADA': '₳', 'DOT': '●', 'XMR': 'ɱ'
        };

        function connectWebSocket() {
            if (!user.id) return;
            ws = new WebSocket(`${WS_URL}/ws/${user.id}`);
            ws.onopen = () => console.log('WebSocket connected');
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'balance_update' || data.type === 'trade_complete') {
                    loadBalances();
                }
            };
            ws.onclose = () => {
                console.log('WebSocket disconnected');
                setTimeout(connectWebSocket, 3000);
            };
        }

        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/wallet/balance`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    displayBalances(data.balances);
                    const totalUSD = calculateTotalBalance(data.balances);
                    document.getElementById('totalBalance').textContent = `$${totalUSD.toFixed(2)}`;
                    document.getElementById('totalEarnings').textContent = `$${(data.total_earnings || 0).toFixed(2)}`;
                    updateKYCStatus(data.kyc_status, data.kyc_verified);
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        function displayBalances(balances) {
            const grid = document.getElementById('balancesGrid');
            grid.innerHTML = '';
            for (const [crypto, amount] of Object.entries(balances)) {
                const card = document.createElement('div');
                card.className = 'balance-card';
                card.innerHTML = `
                    <div class="balance-crypto">${cryptoIcons[crypto] || '💎'}</div>
                    <div class="balance-symbol">${crypto}</div>
                    <div class="balance-amount">${parseFloat(amount).toFixed(4)}</div>
                `;
                grid.appendChild(card);
            }
        }

        function calculateTotalBalance(balances) {
            const usdtValue = balances.USDT || 0;
            const btcValue = (balances.BTC || 0) * 45000;
            const ethValue = (balances.ETH || 0) * 2500;
            return usdtValue + btcValue + ethValue;
        }

        function updateKYCStatus(status, verified) {
            const statusEl = document.getElementById('kycStatus');
            if (verified) {
                statusEl.textContent = '✓';
                statusEl.style.color = 'var(--primary)';
            } else if (status === 'pending') {
                statusEl.textContent = '⏳';
            } else {
                statusEl.textContent = '✗';
                statusEl.style.color = 'var(--accent)';
            }
        }

        async function loadBalances() {
            try {
                const response = await fetch(`${API_URL}/wallet/balance`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    displayBalances(data.balances);
                }
            } catch (error) {
                console.error('Error refreshing balances:', error);
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                if (ws) ws.close();
                window.location.href = 'login.html';
            }
        }

        document.getElementById('userName').textContent = user.full_name || user.email || 'User';
        loadDashboard();
        connectWebSocket();
        setInterval(loadBalances, 30000);
    </script>
</body>
</html>
